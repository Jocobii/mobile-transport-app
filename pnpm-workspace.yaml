packages:
  - "apps/*"
  - "packages/*"

# React Native / Expo tooling is most reliable with a flat node_modules layout in pnpm monorepos.
# See https://docs.expo.dev/guides/monorepos/
nodeLinker: hoisted

# Dependencies allowed to run install scripts (pnpm blocks them by default).
# sharp and unrs-resolver come from the Next.js template (image optimization, ESLint); not needed for an API-only server.
allowBuilds:
  sharp: false
  unrs-resolver: false
